name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also builds @depadmin/shared and generates the Prisma Client (root postinstall).
      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Fails if the backend domain drops below 90% coverage.
      - run: pnpm --filter @depadmin/backend test:cov
      # Starts PostgreSQL 18 with Testcontainers (Docker is preinstalled on the runner).
      - run: pnpm test:int
      - run: pnpm test:e2e
      - run: pnpm build
      # Browser tests run against the build: a real database, the API and the SPA.
      - run: pnpm --filter @depadmin/e2e exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7

  # The production images (Dockerfile) still build. They are published only from main, by
  # the Deploy workflow, which reuses this cache.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
