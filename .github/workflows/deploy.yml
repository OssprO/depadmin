name: Deploy

# Publishes the images to GHCR and deploys them to the VPS (docs/DESPLIEGUE.md), after CI
# passes on main, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancelled halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.names.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: names
        name: Image names (GHCR wants them in lowercase)
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/depadmin" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          build-args: APP_VERSION=${{ steps.names.outputs.tag }}
          tags: |
            ${{ steps.names.outputs.image }}-api:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.image }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ steps.names.outputs.image }}-web:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.image }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      APP_DIR: ${{ vars.DEPLOY_PATH || '/opt/depadmin' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.images.outputs.tag }}
      - name: Key and known host of the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Copy the compose file and the scripts
        run: >
          scp -p -i ~/.ssh/deploy_key -P "$SSH_PORT"
          infra/docker-compose.yml infra/deploy.sh infra/backup.sh "$SSH_USER@$SSH_HOST:$APP_DIR/"
      - name: Deploy this version
        run: ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$APP_DIR/deploy.sh ${{ needs.images.outputs.tag }}"
