name: Deploy

# Publishes the images to GHCR and deploys them to the VPS (docs/DESPLIEGUE.md), after CI
# passes on main, or by hand from the Actions tab. Each deploy is a release: a semantic
# version from the commits (ADR-0027), tagged and listed in GitHub Releases once it runs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancelled halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    # Only main is released, also when run by hand.
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.names.outputs.sha }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The whole history and its tags, to find the last release and the commits since.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: names
        name: Image names (GHCR wants them in lowercase) and the version
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/depadmin" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(node packages/release/src/cli.ts)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          build-args: APP_VERSION=${{ steps.names.outputs.version }}
          tags: |
            ${{ steps.names.outputs.image }}-api:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.image }}-api:${{ steps.names.outputs.sha }}
            ${{ steps.names.outputs.image }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ steps.names.outputs.image }}-web:${{ steps.names.outputs.version }}
            ${{ steps.names.outputs.image }}-web:${{ steps.names.outputs.sha }}
            ${{ steps.names.outputs.image }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      APP_DIR: ${{ vars.DEPLOY_PATH || '/opt/depadmin' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.images.outputs.sha }}
      - name: Key and known host of the VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Copy the compose file and the scripts
        run: >
          scp -p -i ~/.ssh/deploy_key -P "$SSH_PORT"
          infra/docker-compose.yml infra/deploy.sh infra/backup.sh "$SSH_USER@$SSH_HOST:$APP_DIR/"
      - name: Deploy this version
        run: ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$APP_DIR/deploy.sh ${{ needs.images.outputs.version }}"

  # Tags the commit and lists it in GitHub Releases once it runs in production, with notes
  # from the pull requests it brings. A deploy run again finds the release already there.
  release:
    needs: [images, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.images.outputs.version }}
      SHA: ${{ needs.images.outputs.sha }}
    steps:
      - name: Release ${{ env.TAG }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released."
          else
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes
          fi
