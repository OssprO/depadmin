# Update PRs against develop on the 1st of each month (docs/SEGURIDAD.md), grouped so they
# don't pile up: one for minor and patch releases of each ecosystem; majors come one by
# one, since they may need code changes. Security updates (when the repository turns them
# on) come as soon as an advisory is out; they ignore target-branch and go to the default
# branch, which is develop too.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Node's types follow the Node that runs the app (.nvmrc): a new major goes with it.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      timezone: America/Mexico_City
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      timezone: America/Mexico_City
    commit-message:
      prefix: build
    groups:
      images:
        patterns: ['*']
    # A new Node major goes together with .nvmrc and CI, by hand.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Postgres in production. Never its major version: moving to a new one needs a dump and a
  # restore (docs/DESPLIEGUE.md), not just a new image.
  - package-ecosystem: docker-compose
    directory: /infra
    target-branch: develop
    schedule:
      interval: monthly
      timezone: America/Mexico_City
    commit-message:
      prefix: build
    ignore:
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
