# nginx inside the `web` container (docs/adr/0026-despliegue-con-nginx.md): serves the SPA
# and proxies /api to the API, so both share one origin and no CORS is needed. TLS ends in
# the VPS's own nginx, in front of this one.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Docker's DNS, asked on every request: a deploy recreates the API with a new address,
    # and a name resolved once at startup would keep pointing at the old one (502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # The history import is about 200 KB; the API accepts up to 1 MB.
        client_max_body_size 2m;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        # Appends the address this proxy saw; the API trusts the private ones (TRUST_PROXY).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Vite puts a hash in every file name under /assets: they never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page that loads everything else: always checked, so a deploy shows up at once.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Any other path is a screen of the SPA (TanStack Router), unless it is a file.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
