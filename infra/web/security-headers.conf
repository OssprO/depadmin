# Headers for the SPA's own files (the API sets its own with helmet). Included by every
# location that adds a header, because nginx drops the inherited ones in that case. Fonts
# allow data: because Vite inlines the smallest font files into the CSS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# A private app: kept out of search engines (robots.txt says the same).
add_header X-Robots-Tag "noindex, nofollow" always;
