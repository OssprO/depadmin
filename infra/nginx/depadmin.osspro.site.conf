# Virtual host of the VPS's own nginx (docs/DESPLIEGUE.md, step 5), in
# /etc/nginx/sites-available/depadmin.osspro.site. It only forwards to the `web` container on
# 127.0.0.1:WEB_PORT; certbot adds the HTTPS part (listen 443 and the certificate) itself.
server {
    listen 80;
    listen [::]:80;
    server_name depadmin.osspro.site;

    location / {
        proxy_pass http://127.0.0.1:8063;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The address that connected, replacing whatever the client claims: the API counts
        # login attempts by it (TRUST_PROXY).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The history import is about 200 KB; the API accepts up to 1 MB.
        client_max_body_size 2m;
        proxy_read_timeout 60s;
    }
}
